<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pierre-Yves Grelier — Videographer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="nav nav--overlay">
    <span class="nav-name">P.Y. GRELIER</span>
    <div class="nav-links">
      <a href="about.html">About</a>
      <a href="index.html" class="is-active">Work</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <header class="reel">
    <video class="reel-video" src="videos/hero-mashup.mp4" poster="images/hero-mashup.jpg" autoplay muted loop playsinline></video>
    <div class="reel-overlay">
      <h1>PY <span class="em">Grelier</span></h1>
      <p class="reel-role">Videographer</p>
      <p class="reel-location">Based in Dubai, UAE</p>
      <div class="brand-bar"><span></span><span></span><span></span><span></span></div>
    </div>
  </header>

  <div class="work-filter-pills" id="work-filter-pills"></div>

  <main>
    <section class="work">
      <div class="carousel-wrap">
        <div id="project-grid" class="work-sections">
          <!-- Generated from projects.js -->
        </div>
      </div>
      <p class="carousel-hint">Click a project to preview</p>
    </section>
  </main>

  <footer class="footer">
    <span>© 2026 Pierre-Yves Grelier</span>
  </footer>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-panel">
      <button class="lightbox-close" aria-label="Close preview" type="button">&times;</button>
      <div class="lightbox-media"></div>
      <div class="lightbox-info">
        <div class="lightbox-title"></div>
        <div class="lightbox-category"></div>
        <a class="lightbox-link" href="#" target="_blank" rel="noopener">Watch full video ↗</a>
      </div>
    </div>
  </div>

  <script src="projects.js"></script>
  <script src="script.js"></script>
</body>
</html>
